<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-red-700 text-white flex flex-col p-6">
            <h2 class="text-2xl font-bold mb-6">🔥 Dashboard</h2>
            <nav class="space-y-4">
                <a href="index.html" class="block py-2 px-4 hover:bg-black rounded-lg">🏠 Home</a>
                <a href="analytics.html" class="block py-2 px-4 hover:bg-black rounded-lg">📊 Analytics</a>
                <a href="users.html" class="block py-2 px-4 hover:bg-black rounded-lg">👥 Users</a>
                <a href="settings.html" class="block py-2 px-4 bg-black rounded-lg">⚙️ Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <!-- Header -->
            <header class="bg-black shadow-md p-4 rounded-lg mb-6">
                <h1 class="text-xl font-bold">⚙️ Settings</h1>
            </header>

            <!-- Profile Settings -->
            <section class="bg-red-800 p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-semibold mb-4">Profile Settings</h2>
                <form>
                    <label class="block mb-2">Name:</label>
                    <input type="text" class="p-2 w-full rounded bg-gray-800 border border-gray-700 mb-4" value="Vensi">

                    <label class="block mb-2">Email:</label>
                    <input type="email" class="p-2 w-full rounded bg-gray-800 border border-gray-700 mb-4" value="vensi@example.com">

                    <label class="block mb-2">New Password:</label>
                    <input type="password" class="p-2 w-full rounded bg-gray-800 border border-gray-700 mb-4">

                    <button class="bg-black px-4 py-2 rounded-lg text-white mt-4">Save Changes</button>
                </form>
            </section>

            <!-- Dark Mode Toggle -->
            <section class="bg-red-800 p-6 rounded-lg shadow-md mt-6">
                <h2 class="text-lg font-semibold mb-4">Dark Mode</h2>
                <label class="flex items-center">
                    <input type="checkbox" class="mr-2">
                    Enable Dark Mode
                </label>
            </section>
        </main>
    </div>

</body>
</html>
