<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Users - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">

    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-red-700 text-white flex flex-col p-6">
            <h2 class="text-2xl font-bold mb-6">🔥 Dashboard</h2>
            <nav class="space-y-4">
                <a href="index.html" class="block py-2 px-4 hover:bg-black rounded-lg">🏠 Home</a>
                <a href="analytics.html" class="block py-2 px-4 hover:bg-black rounded-lg">📊 Analytics</a>
                <a href="users.html" class="block py-2 px-4 bg-black rounded-lg">👥 Users</a>
                <a href="settings.html" class="block py-2 px-4 hover:bg-black rounded-lg">⚙️ Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <!-- Header -->
            <header class="bg-black shadow-md p-4 rounded-lg mb-6 flex justify-between">
                <h1 class="text-xl font-bold">👥 Users</h1>
                <input type="text" placeholder="🔍 Search Users..." class="p-2 rounded bg-gray-800 text-white border border-gray-700">
            </header>

            <!-- Users List -->
            <section class="bg-red-800 p-6 rounded-lg shadow-md">
                <h2 class="text-lg font-semibold mb-4">Active Users</h2>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="border-b border-gray-700">
                            <th class="p-3">Profile</th>
                            <th class="p-3">Name</th>
                            <th class="p-3">Email</th>
                            <th class="p-3">Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr class="border-b border-gray-700">
                            <td class="p-3"><img src="https://via.placeholder.com/40" class="rounded-full"></td>
                            <td class="p-3">vensi</td>
                            <td class="p-3">vensi@example.com</td>
                            <td class="p-3 text-green-400">Active</td>
                        </tr>
                        <tr class="border-b border-gray-700">
                            <td class="p-3"><img src="https://via.placeholder.com/40" class="rounded-full"></td>
                            <td class="p-3">Drashti</td>
                            <td class="p-3">Drashti@example.com</td>
                            <td class="p-3 text-red-400">Inactive</td>
                        </tr>
                        <tr>
                            <td class="p-3"><img src="https://via.placeholder.com/40" class="rounded-full"></td>
                            <td class="p-3">Prearna</td>
                            <td class="p-3">Prearna@example.com</td>
                            <td class="p-3 text-green-400">Active</td>
                        </tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

</body>
</html>
