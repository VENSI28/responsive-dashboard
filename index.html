<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white">

    <!-- Sidebar & Main Content -->
    <div class="flex h-screen">
        <!-- Sidebar -->
        <aside class="w-64 bg-red-700 text-white flex flex-col p-6">
            <h2 class="text-2xl font-bold mb-6">🔥 Dashboard</h2>
            <nav class="space-y-4">
                <a href="index.html" class="block py-2 px-4 bg-black rounded-lg">🏠 Home</a>
                <a href="analytics.html" class="block py-2 px-4 hover:bg-black rounded-lg">📊 Analytics</a>
                <a href="users.html" class="block py-2 px-4 hover:bg-black rounded-lg">👥 Users</a>
                <a href="settings.html" class="block py-2 px-4 hover:bg-black rounded-lg">⚙️ Settings</a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="flex-1 p-6">
            <!-- Navbar -->
            <header class="bg-black shadow-md p-4 rounded-lg mb-6 flex justify-between">
                <h1 class="text-xl font-bold">🏠 Dashboard Overview</h1>
                <button class="bg-red-500 text-white px-4 py-2 rounded-lg">Profile</button>
            </header>

            <!-- Stats Section -->
            <section class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-6">
                <div class="bg-red-800 p-6 rounded-lg shadow-md">
                    <h2 class="text-lg font-semibold">Users</h2>
                    <p class="text-2xl font-bold text-white">1,245</p>
                </div>
                <div class="bg-red-800 p-6 rounded-lg shadow-md">
                    <h2 class="text-lg font-semibold">Revenue</h2>
                    <p class="text-2xl font-bold text-white">$12,350</p>
                </div>
                <div class="bg-red-800 p-6 rounded-lg shadow-md">
                    <h2 class="text-lg font-semibold">Orders</h2>
                    <p class="text-2xl font-bold text-white">87</p>
                </div>
            </section>
        </main>
    </div>

</body>
</html>
